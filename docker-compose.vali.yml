services:
  validator:
    image: entrius/allways:latest
    container_name: aw-vali
    restart: unless-stopped
    mem_limit: "1g"
    entrypoint: /app/scripts/vali-entrypoint.sh
    env_file:
      - .env
    volumes:
      - ${WALLET_PATH}:/root/.bittensor/wallets:ro
      - ./data/allways:/root/.allways
    # `docker logs` buffer: 3 x 10 MB, oldest dropped. Dies with the container; the durable copy is
    # ./data/allways/bittensor.log, rotated by the validator (LOG_FILE_MAX_MB / LOG_FILE_BACKUPS).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower
    container_name: allways-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 200
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
